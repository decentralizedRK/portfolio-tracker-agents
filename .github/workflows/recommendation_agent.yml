name: Weekly Recommendations

# Every Monday 8:30 AM IST = 3:00 AM UTC
# Also runs daily at 3:00 AM UTC on Mon–Fri for freshness
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run recommendation agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agents/recommendation_agent.py

      - name: Copy data to docs
        run: |
          mkdir -p docs/data
          cp data/recommendations.json docs/data/ 2>/dev/null || true

      - name: Commit & push
        run: |
          git config user.name  "portfolio-bot[bot]"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/recommendations.json docs/data/recommendations.json
          git diff --staged --quiet || git commit -m "chore: weekly recommendations $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
