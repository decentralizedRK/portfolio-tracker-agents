name: Morning News Digest

# 8:00 AM IST = 2:30 AM UTC
on:
  schedule:
    - cron: '30 2 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agents/news_agent.py

      - name: Copy data to docs
        run: |
          mkdir -p docs/data
          cp data/news_digest.json docs/data/ 2>/dev/null || true

      - name: Commit & push
        run: |
          git config user.name  "portfolio-bot[bot]"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/news_digest.json docs/data/news_digest.json
          git diff --staged --quiet || git commit -m "chore: news digest $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
