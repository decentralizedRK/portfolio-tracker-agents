name: Corporate Actions Tracker

# Daily 8:30 AM IST = 3:00 AM UTC on trading days
on:
  schedule:
    - cron: '5 3 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run corporate action agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agents/corporate_action_agent.py

      - name: Copy data to docs
        run: |
          mkdir -p docs/data
          cp data/corporate_actions.json docs/data/ 2>/dev/null || true

      - name: Commit & push
        run: |
          git config user.name  "portfolio-bot[bot]"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/corporate_actions.json docs/data/corporate_actions.json
          git diff --staged --quiet || git commit -m "chore: corporate actions $(date -u '+%Y-%m-%d')"
          git push
