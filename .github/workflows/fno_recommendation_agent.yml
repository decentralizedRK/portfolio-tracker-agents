name: F&O Technical Scan

# Every weekday (Mon–Fri) 8:35 AM IST = 3:05 AM UTC (5 min after portfolio recs)
on:
  schedule:
    - cron: '5 3 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fno-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run F&O recommendation agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agents/fno_recommendation_agent.py

      - name: Copy data to docs
        run: |
          mkdir -p docs/data
          cp data/fno_recommendations.json docs/data/ 2>/dev/null || true

      - name: Commit & push
        run: |
          git config user.name  "portfolio-bot[bot]"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/fno_recommendations.json docs/data/fno_recommendations.json
          git diff --staged --quiet || git commit -m "chore: fno recommendations $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
