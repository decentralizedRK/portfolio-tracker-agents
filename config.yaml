scheduler:
  interval_minutes: 5
  extended_hours: false        # set true to get US pre-market / after-hours alerts
  markets:
    NSE:
      timezone: Asia/Kolkata
      open: "09:15"
      close: "15:30"
    NYSE:
      timezone: America/New_York
      open: "09:30"
      close: "16:00"

telegram:
  bot_token: ""                # or set TELEGRAM_BOT_TOKEN env var
  chat_id: ""                  # or set TELEGRAM_CHAT_ID env var

notifications:
  console: true
  telegram: true
  desktop: false
